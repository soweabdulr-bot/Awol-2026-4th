<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWOL Europe Awards Night: vote now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700&family=Instrument+Sans:wght@400;500;600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --curtain: #7A1027; --curtain-deep: #4B0A18;
    --paper: #F7F0E1; --ink: #1E1A2B; --ink-soft: #5B5568; --line: rgba(30,26,43,.22);
    --brass: #A7761C; --on-curtain: #F7F0E1; --focus: #F2C14E;
    --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --curtain: #2E0713; --curtain-deep: #14030A; --paper: #E9E0CB; --ink: #191524; --ink-soft: #4E4959; }
  }
  :root[data-theme="dark"] { --curtain: #2E0713; --curtain-deep: #14030A; --paper: #E9E0CB; --ink: #191524; --ink-soft: #4E4959; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--curtain); }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.55; color: var(--on-curtain);
    background-color: var(--curtain);
    background-image: linear-gradient(90deg, rgba(0,0,0,.24) 0%, rgba(255,255,255,.05) 22%, rgba(0,0,0,.14) 48%, rgba(255,255,255,.06) 74%, rgba(0,0,0,.24) 100%);
    background-size: 180px 100%; min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  .brand { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto 22px; border-radius: 12px; box-shadow: 0 16px 34px -12px rgba(0,0,0,.65); }
  .sheet { background: var(--paper); color: var(--ink); border-radius: 6px; box-shadow: 0 20px 40px -14px rgba(0,0,0,.6); }
  .sec { padding: 26px 22px; border-top: 2px dashed var(--line); }
  .sec:first-child { border-top: 0; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.12; margin: 0 0 10px; }
  h1 { font-size: clamp(2rem, 8vw, 2.7rem); }
  h2 { font-size: 1.5rem; }
  p { margin: 0 0 16px; }
  .lede { color: var(--ink-soft); max-width: 46ch; }
  .lede.sm { font-size: .93rem; margin-top: -6px; }

  .catlist { margin: 0; padding: 0; list-style: none; }
  .cat-item { padding: 18px 0; border-top: 2px dashed var(--line); }
  .cat-item:first-child { border-top: 0; padding-top: 4px; }
  .cat-item h3 {
    font-family: 'Cinzel', var(--display); font-weight: 700; font-size: 1.42rem; line-height: 1.22;
    letter-spacing: .03em; text-transform: uppercase; color: var(--brass);
    margin: 0 0 8px; padding-bottom: 8px; border-bottom: 2px solid rgba(167,118,28,.35);
    overflow-wrap: anywhere;
  }
  .cat-item .picked { font-size: .88rem; color: var(--ink-soft); margin: 0 0 10px; }
  .cat-item .picked.on { color: var(--brass); font-weight: 600; }
  .noms { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .nom {
    position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 0;
    padding: 8px; margin: 0; border-radius: 8px; cursor: pointer; min-width: 0;
  }
  .nom:hover { background: rgba(30,26,43,.05); }
  .nom.sel { background: rgba(167,118,28,.16); box-shadow: inset 0 0 0 2px var(--brass); }
  .nom input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .nom input:focus-visible ~ .ph { outline: 3px solid var(--brass); outline-offset: 3px; }
  .ph {
    width: 84%; max-width: 128px; aspect-ratio: 1 / 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 2rem; letter-spacing: .02em; position: relative; margin: 0 auto 10px;
    box-shadow: 0 6px 14px -4px rgba(0,0,0,.45);
  }
  .nom.sel .ph { outline: 3px solid var(--brass); outline-offset: 3px; }
  .ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .nom.sel .ph::after {
    content: ""; position: absolute; right: 2px; bottom: 2px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 2px var(--paper);
    background-image: linear-gradient(45deg, transparent 40%, var(--paper) 40%, var(--paper) 46%, transparent 46%),
      linear-gradient(-45deg, transparent 55%, var(--paper) 55%, var(--paper) 61%, transparent 61%);
  }
  .nom .who { display: flex; flex-direction: column; min-width: 0; overflow: hidden; text-align: center; }
  .nom .who strong { font-weight: 600; overflow-wrap: anywhere; font-size: .96rem; }
  .nom .who span { color: var(--ink-soft); font-size: .85rem; overflow-wrap: anywhere; }

  .send-wrap { margin-top: 22px; }
  .btn {
    display: block; width: 100%; text-align: center; cursor: pointer;
    background: var(--ink); color: var(--paper); border: 2px solid var(--ink); border-radius: 6px;
    padding: 15px 20px; font-size: 1.1rem; font-weight: 600; min-height: 54px;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .send-note { margin: 10px 0 0; font-size: .88rem; color: var(--ink-soft); text-align: center; }

  .confirm { text-align: center; padding: 8px 0; }
  .confirm .mark {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; background: var(--brass);
    display: flex; align-items: center; justify-content: center;
  }
  .confirm .mark svg { width: 30px; height: 30px; }
  .confirm h2 { margin-bottom: 6px; }
  .confirm p { margin: 0 auto 18px; }
  .confirm ul { list-style: none; margin: 0 0 20px; padding: 0; text-align: left; display: grid; gap: 10px; }
  .confirm ul li { border-top: 1px solid var(--line); padding: 10px 0 0; }
  .confirm ul li:first-child { border-top: 0; padding-top: 0; }
  .confirm ul li b { display: block; font-size: .85rem; color: var(--ink-soft); font-weight: 500; }
  .confirm .btn.ghost { background: transparent; color: var(--ink); }

  .foot { text-align: center; margin: 22px 0 0; font-size: .93rem; opacity: .85; }
  @media (max-width: 380px) { .noms { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

  var picks = {};

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() {
    var html = DATA.map(function (c) {
      var chosen = picks[c.id];
      var chosenNom = chosen ? c.nominees.filter(function (n) { return n.id === chosen; })[0] : null;
      return '<li class="cat-item"><h3>' + esc(c.name) + '</h3>' +
        '<p class="picked' + (chosenNom ? " on" : "") + '">' + (chosenNom ? "Chosen: " + esc(chosenNom.name) : "Pick one") + "</p>" +
        '<ul class="noms" role="radiogroup" aria-label="' + esc(c.name) + '">' +
        c.nominees.map(function (n) {
          var on = chosen === n.id;
          return '<li><label class="nom' + (on ? " sel" : "") + '">' +
            '<input type="radio" name="cat-' + esc(c.id) + '" value="' + esc(n.id) + '" data-cat="' + esc(c.id) + '"' + (on ? " checked" : "") + '>' +
            '<span class="ph"' + (n.photo ? '' : ' style="background:' + n.color + '"') + ' aria-hidden="true">' +
            (n.photo ? '<img src="' + n.photo + '" alt="">' : esc(n.initials)) + '</span>' +
            '<span class="who"><strong>' + esc(n.name) + '</strong>' + ((n.city || n.country) ? '<span>' + esc([n.city, n.country].filter(Boolean).join(", ")) + '</span>' : '') + '</span>' +
            '</label></li>';
        }).join("") + "</ul></li>";
    }).join("");
    document.getElementById("catlist").innerHTML = html;
    var done = DATA.filter(function (c) { return picks[c.id]; }).length;
    var btn = document.getElementById("send-btn");
    btn.disabled = done < DATA.length;
    document.getElementById("send-note").textContent = done + " of " + DATA.length + " categories chosen";
  }

    document.getElementById("confirm-list").innerHTML = repeat ? "" : list.map(function (row) {
      return '<li><b>' + esc(row.cat) + '</b>' + esc(row.name) + '</li>';
    }).join("");
    document.getElementById("form-sec").hidden = true;
    document.getElementById("confirm-sec").hidden = false;
    window.scrollTo(0, 0);
  }

  function alreadyVoted() {
    try {
      var raw = window.localStorage.getItem(LOCK_KEY);
      if (!raw) return false;
      var saved = JSON.parse(raw);
      if (Array.isArray(saved) && saved.length) { showConfirm(saved, true); return true; }
    } catch (e) {}
    return false;
  }

  document.getElementById("catlist").addEventListener("change", function (e) {
    var input = e.target.closest('input[type="radio"]');
    if (!input) return;
    picks[input.getAttribute("data-cat")] = input.value;
    render();
  });

  document.getElementById("send-btn").addEventListener("click", function () {
    var list = DATA.map(function (c) {
      var n = c.nominees.filter(function (x) { return x.id === picks[c.id]; })[0];
      return { cat: c.name, name: n.name };
    });
    try { window.localStorage.setItem(LOCK_KEY, JSON.stringify(list)); } catch (e) {}
    showConfirm(list, false);
  });

  if (!alreadyVoted()) render();
})();
</script>
</body>
</html>
